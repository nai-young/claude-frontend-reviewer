name: Deploy Preview Comment

on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Post deploy preview link
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "🚀 **Deploy Preview** will be available at: https://claude-frontend-reviewer-git-${{ github.head_ref }}-nai-youngs-projects.vercel.app"
            })
